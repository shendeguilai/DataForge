name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generation-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated execution images
        run: |
          docker build -f services/generation-runner/Dockerfile.sandbox -t dataforge-generation-sandbox:local services/generation-runner
          docker build -t dataforge-generation-runner:ci services/generation-runner
      - name: Exercise sandbox boundaries and compiler
        run: DATAFORGE_DOCKER_TESTS=1 python3 -m unittest discover -s services/generation-runner -p 'test_*.py' -v
  browser-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated test server and browser
        run: |
          mvn --batch-mode test-compile dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/dataforge-classpath.txt"
          npm install --prefix "$RUNNER_TEMP/dataforge-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/dataforge-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser flows against test fixtures
        run: |
          export DATAFORGE_E2E_CLASSPATH="$(< "$RUNNER_TEMP/dataforge-classpath.txt")"
          export NODE_PATH="$RUNNER_TEMP/dataforge-browser/node_modules"
          node tests/e2e/platform.cjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test with H2 and PostgreSQL Testcontainers
        run: mvn --batch-mode verify
      - name: Validate production Compose
        env:
          POSTGRES_DB: dataforge
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: ci-database-password
          DATAFORGE_POSTGRES_DIR: /tmp/dataforge/postgres
          DATAFORGE_RUNTIME_DIR_HOST: /tmp/dataforge/runtime
          DATAFORGE_BACKUP_DIR: /tmp/dataforge/backups
          DATAFORGE_MIGRATION_DIR: /tmp/dataforge/migration
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-admin-password
          INVITE_CODE: ci-invite-code
          DATAFORGE_SECRET: ci-encryption-secret-0123456789
        run: docker compose -f compose.prod.yml config >/dev/null
      - name: Build production image
        run: docker build -t dataforge:ci .
      - name: Build CSP Paper Studio image
        run: docker build -t dataforge-csp-studio:ci services/csp-paper-studio
      - name: Run CSP Paper Studio regression tests
        run: >-
          docker run --rm --entrypoint python
          -v "${GITHUB_WORKSPACE}:/workspace:ro"
          -w /workspace/services/csp-paper-studio
          -e PYTHONPATH=/app:/workspace/services/csp-paper-studio
          dataforge-csp-studio:ci
          -m unittest discover -p 'test_*.py' -v
      - name: Check CSP Paper Studio health
        run: |
          set -Eeuo pipefail
          container="csp-studio-ci"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            dataforge-csp-studio:ci >/dev/null
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
