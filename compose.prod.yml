name: dataforge

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: prod
  TZ: UTC
  PORT: "8080"
  DATAFORGE_SESSION_TIMEOUT: ${DATAFORGE_SESSION_TIMEOUT:-7d}
  JAVA_TOOL_OPTIONS: ${DATAFORGE_JAVA_OPTIONS:-}
  DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATAFORGE_RUNTIME_DIR: /var/lib/dataforge/runtime
  DATAFORGE_PROCESS_STACK_MB: ${DATAFORGE_PROCESS_STACK_MB:-256}
  DAILY_GENERATION_LIMIT: ${DAILY_GENERATION_LIMIT:-30}
  INVITE_CODE: ${INVITE_CODE:?INVITE_CODE is required}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
  DATAFORGE_SECRET: ${DATAFORGE_SECRET:?DATAFORGE_SECRET is required}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-deepseek-v4-pro}
  ATCODER_COOKIE: ${ATCODER_COOKIE:-}
  CSP_STUDIO_BASE_URL: ${CSP_STUDIO_BASE_URL:-http://csp-studio:8765}
  CSP_SIM_WORKER_SECRET: ${CSP_SIM_WORKER_SECRET:-}
  DATAFORGE_EXECUTION_SECRET: ${DATAFORGE_EXECUTION_SECRET:-}
  DATAFORGE_GENERATION_CONCURRENCY: ${DATAFORGE_GENERATION_CONCURRENCY:-1}
  DATAFORGE_ATCODER_WEEKLY_ENABLED: ${DATAFORGE_ATCODER_WEEKLY_ENABLED:-true}
  DATAFORGE_TEMP_RETENTION_DAYS: ${DATAFORGE_TEMP_RETENTION_DAYS:-30}
  DATAFORGE_TEMP_CLEANUP_ENABLED: ${DATAFORGE_TEMP_CLEANUP_ENABLED:-false}
  QUIZ_COUNTDOWN_SECONDS: ${QUIZ_COUNTDOWN_SECONDS:-3}
  QUIZ_BUZZ_SECONDS: ${QUIZ_BUZZ_SECONDS:-15}
  QUIZ_ROOM_EXPIRY_MINUTES: ${QUIZ_ROOM_EXPIRY_MINUTES:-30}
  QUIZ_ROOM_CAPACITY: ${QUIZ_ROOM_CAPACITY:-60}

x-app-base: &app-base
  image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge:${DATAFORGE_IMAGE_TAG:-local}
  mem_limit: ${DATAFORGE_APP_MEMORY_LIMIT:-0}
  environment: *app-environment
  volumes:
    - ${DATAFORGE_RUNTIME_DIR_HOST:?DATAFORGE_RUNTIME_DIR_HOST is required}:/var/lib/dataforge/runtime
  depends_on:
    db:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  generation-runner:
    image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-generation-runner:${DATAFORGE_IMAGE_TAG:-local}
    build:
      context: services/generation-runner
    environment:
      DATAFORGE_EXECUTION_SECRET: ${DATAFORGE_EXECUTION_SECRET:-}
      DATAFORGE_GENERATION_CONCURRENCY: ${DATAFORGE_GENERATION_CONCURRENCY:-1}
      DATAFORGE_GENERATION_SANDBOX_IMAGE: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-generation-sandbox:${DATAFORGE_IMAGE_TAG:-local}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=${DATAFORGE_RUNNER_TMP_SIZE:-192m},mode=1777
    mem_limit: ${DATAFORGE_RUNNER_MEMORY_LIMIT:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  generation-sandbox-image:
    profiles: ["generation-build"]
    image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-generation-sandbox:${DATAFORGE_IMAGE_TAG:-local}
    build:
      context: services/generation-runner
      dockerfile: Dockerfile.sandbox
    entrypoint: ["/bin/true"]
    restart: "no"
  csp-judge-worker:
    profiles: ["csp-sim"]
    image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-csp-worker:${DATAFORGE_IMAGE_TAG:-local}
    build:
      context: services/csp-sim-worker
      dockerfile: Dockerfile
    environment:
      CSP_SIM_WORKER_SECRET: ${CSP_SIM_WORKER_SECRET:-}
      CSP_SIM_API_URL: http://app:8080/api/tools/csp-sim
      CSP_SIM_SANDBOX_IMAGE: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-csp-sandbox:${DATAFORGE_IMAGE_TAG:-local}
      CSP_SIM_CONCURRENCY: ${CSP_SIM_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  csp-sandbox-image:
    profiles: ["csp-sim-build"]
    image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-csp-sandbox:${DATAFORGE_IMAGE_TAG:-local}
    build:
      context: services/csp-sim-worker
      dockerfile: Dockerfile.sandbox
    entrypoint: ["/bin/true"]
    restart: "no"

  db:
    image: ${DATAFORGE_POSTGRES_IMAGE:-postgres:17.10-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATAFORGE_POSTGRES_DIR:?DATAFORGE_POSTGRES_DIR is required}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      csp-studio:
        condition: service_healthy
      generation-runner:
        condition: service_healthy
    ports:
      - ${PUBLIC_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped

  csp-studio:
    image: ${DATAFORGE_REGISTRY_PREFIX:-}dataforge-csp-studio:${DATAFORGE_IMAGE_TAG:-local}
    build:
      context: services/csp-paper-studio
      dockerfile: Dockerfile
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3))['status']=='UP'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  importer:
    <<: *app-base
    profiles: ["tools"]
    environment:
      <<: *app-environment
      DATAFORGE_BOOTSTRAP_ENABLED: "false"
      DATAFORGE_LEGACY_IMPORT_ENABLED: "true"
      DATAFORGE_LEGACY_IMPORT_H2_FILE: /migration/dataforge.mv.db
      DATAFORGE_LEGACY_IMPORT_RUNTIME_DIR: /migration/runtime
      DATAFORGE_LEGACY_IMPORT_OLD_SECRET: ${LEGACY_DATAFORGE_SECRET:-}
      DATAFORGE_LEGACY_IMPORT_ALLOW_MISSING_ARTIFACTS: ${LEGACY_ALLOW_MISSING_ARTIFACTS:-false}
    volumes:
      - ${DATAFORGE_RUNTIME_DIR_HOST:?DATAFORGE_RUNTIME_DIR_HOST is required}:/var/lib/dataforge/runtime
      - ${DATAFORGE_MIGRATION_DIR:?DATAFORGE_MIGRATION_DIR is required}:/migration:ro
    command: ["--spring.main.web-application-type=none"]
    restart: "no"

  admin-reset:
    <<: *app-base
    profiles: ["tools"]
    environment:
      <<: *app-environment
      DATAFORGE_BOOTSTRAP_ENABLED: "false"
      DATAFORGE_ADMIN_RESET_ENABLED: "true"
      DATAFORGE_ADMIN_RESET_USERNAME: ${DATAFORGE_ADMIN_RESET_USERNAME:-}
      DATAFORGE_ADMIN_RESET_PASSWORD: ${DATAFORGE_ADMIN_RESET_PASSWORD:-}
    command: ["--spring.main.web-application-type=none"]
    restart: "no"
